; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_port = COM4
build_flags = 
	-D USER_SETUP_LOADED=1
	-D ILI9342_DRIVER=1
	-D TFT_RGB_ORDER=1
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=13
	-D TFT_DC=17
	-D TFT_RST=16
	-D SPI_FREQUENCY=40000000
	-D LOAD_GLCD=1
	-D LOAD_GFXFF=1
	-I include/fonts
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.12.0
	adafruit/DHT sensor library@^1.4.6
	makuna/RTC@^2.5.0
	adafruit/SdFat - Adafruit Fork@^2.2.54
	olikraus/U8g2@^2.36.5
	mathertel/OneButton@^2.6.1
	https://github.com/madhephaestus/ESP32Encoder.git
	madhephaestus/ESP32Encoder@^0.11.7
	https://github.com/thelastoutpostworkshop/gpio_viewer.git
	https://github.com/dvarrel/AsyncTCP.git
	https://github.com/ESP32Async/ESPAsyncWebServer.git
	bodmer/TFT_eSPI@^2.5.43

[env:esp32dev_test_display]
extends = env:esp32doit-devkit-v1
src_filter = +<test/display_test.cpp> -<src/>

[env:colortest]
extends = env:esp32doit-devkit-v1
lib_deps = bodmer/TFT_eSPI@^2.5.43
build_src_filter = -<*> +<../test/color_test.cpp>
